extends: fr_unet_patch_external.yaml
data:
  preprocessing: raw
  input_channels: 1
  normalization: unit
  external:
    enabled: false
model:
  in_channels: 1
  init_checkpoint: "weights/fr_unet_drive_epoch40.pth"
train:
  lr: 0.0001
  epochs: 40
  ema_decay: 0.0
eval:
  threshold: 0.5
  threshold_low: 0.4
  dti: true
  dti_search: true
  min_area: 0
  fov_mask: true
