extends: fr_unet_official_patch_drive.yaml
data:
  preprocessing: raw
  input_channels: 1
  normalization: unit
  train_patch_size: 64
  external:
    enabled: true
    fives_root: "external_data/fives"
    max_samples: 240
    local_repeat: 8
model:
  in_channels: 1
  init_checkpoint: "weights/fr_unet_drive_epoch40_packaged.pt"
train:
  batch_size: 48
  patches_per_image: 8
  epochs: 6
  early_stopping_patience: 3
  lr: 0.000005
  ema_decay: 0.0
