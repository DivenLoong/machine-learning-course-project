extends: sgl_drive.yaml
data:
  train_patch_size: 192
  external:
    enabled: true
    chase_root: "external_data/CHASE_DB1"
    stare_root: "external_data/STARE"
    local_repeat: 3
train:
  batch_size: 8
  patches_per_image: 4
  epochs: 20
  early_stopping_patience: 6
  lr: 0.00002
  ema_decay: 0.0
