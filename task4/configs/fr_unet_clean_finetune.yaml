extends: fr_unet_official_patch_drive.yaml
data:
  preprocessing: raw
  input_channels: 1
  normalization: unit
  train_patch_size: 64
  external:
    enabled: false
model:
  in_channels: 1
  init_checkpoint: "weights/fr_unet_drive_epoch40_packaged.pt"
loss:
  name: bce_dice
train:
  epochs: 20
  batch_size: 48
  patches_per_image: 8
  early_stopping_patience: 5
  lr: 0.00002
  ema_decay: 0.0
