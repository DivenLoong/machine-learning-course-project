extends: lwnet_drive.yaml
data:
  train_patch_size: 192
  pseudo:
    enabled: true
    root: "pseudo_data/ensemble_soft_v1"
    repeat: 3
model:
  init_checkpoint: "weights/lwnet_drive_packaged.pt"
train:
  batch_size: 8
  predict_batch_size: 2
  patches_per_image: 4
  epochs: 8
  early_stopping_patience: 3
  lr: 0.00001
  ema_decay: 0.0
