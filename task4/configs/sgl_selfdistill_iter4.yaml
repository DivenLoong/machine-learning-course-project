extends: sgl_drive.yaml
data:
  train_patch_size: 192
  pseudo:
    enabled: true
    root: "pseudo_data/iter4_soft"
    repeat: 3
model:
  init_checkpoint: "runs/sgl_selfdistill_iter3_f0/best.pt"
train:
  batch_size: 8
  predict_batch_size: 2
  patches_per_image: 4
  epochs: 1
  early_stopping_patience: 1
  lr: 0.00000125
  ema_decay: 0.0
